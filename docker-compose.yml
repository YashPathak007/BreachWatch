services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: breachwatch
      POSTGRES_USER: breachwatch
      POSTGRES_PASSWORD: breachwatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breachwatch -d breachwatch"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://breachwatch:breachwatch@db:5432/breachwatch
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD}
      DEMO_ANALYST_PASSWORD: ${DEMO_ANALYST_PASSWORD}
      DEMO_VIEWER_PASSWORD: ${DEMO_VIEWER_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
    name: projects_postgres_data
